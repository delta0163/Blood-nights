<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2.5D Shooter Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

    <canvas id="screen"></canvas>

    <div id="hud">
        <div id="crosshair">+</div>

        <div id="health">
            HP: <span id="hp">100</span>
        </div>

        <div id="status">МАНЕКЕН: 100 HP</div>
    </div>

    <!-- Управление -->
    <div id="controls">

        <div id="movePad">
            <button id="up">▲</button>
            <button id="left">◀</button>
            <button id="right">▶</button>
            <button id="down">▼</button>
        </div>

        <div id="lookButtons">
            <button id="turnLeft">⟲</button>
            <button id="turnRight">⟳</button>
        </div>

        <button id="attack">УДАР</button>

    </div>

    <!-- Кулаки -->
    <div id="fists">
        <div class="fist leftFist"></div>
        <div class="fist rightFist"></div>
    </div>

</div>

<script src="game.js"></script>
</body>
</html>
