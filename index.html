<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>2.5D FPS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<div id="crosshair">+</div>

<!-- STYLE появляется только после действия -->
<div id="styleBox">

    <div id="styleTitle">STYLE</div>

    <div id="styleRank">D</div>

    <div id="styleMultiplier">×1</div>

    <div id="stylePoints">0</div>

</div>

<div id="weaponName">КУЛАКИ</div>

<div id="controls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="shootButton">
        ОГОНЬ
    </button>

    <button id="interactButton">
        E
    </button>

    <button id="weaponButton">
        ОРУЖИЕ
    </button>

</div>

<script src="game.js"></script>

</body>
</html>
